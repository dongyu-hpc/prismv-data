[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prismv-data"
version = "0.1.0"
description = "Dataset contract for PRISM-V: schemas, hard validation rules, stratified human-audit sampling and measured pseudo-label precision."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["spatial-reasoning", "dataset", "evaluation", "ground-truth", "pseudo-labels"]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
prismv-data = "prismv_data.contract:main"

# schemas ship with the package: the validator resolves them by relative path
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prismv_data = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
